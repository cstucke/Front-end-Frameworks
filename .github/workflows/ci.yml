# Runs on every branch push and pull request. Milestone tags have their own workflows.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  checks:
    name: Type-check, lint, tests, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: TypeScript — type check
        run: npm run type-check

      - name: ESLint — lint check
        run: npm run lint

      - name: Run tests
        run: npm run test:m2 && npm run test:m3 && npm run test:features

      - name: Build
        run: npm run build
